<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<title>复刻art‑state效果</title>
<style>
/* 严格复刻源码变量与样式 */
:root{
  --art-state-size:80px;
  --art-state-opacity:0.8;
  --art-transition-duration:0.25s;
}
.wrap{
  width:640px;
  height:360px;
  background:#000;
  position:relative;
  cursor:pointer;
}
.mask{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}
.state{
  width:var(--art-state-size);
  height:var(--art-state-size);
  /* transition写在基础选择器！！双向动画 */
  transition: transform var(--art-transition-duration) ease, opacity var(--art-transition-duration) ease;
  opacity:0;
  transform:scale(2);
}
/* 存在这个class：图标显示 */
.wrap.art‑mask‑show .state{
  opacity:var(--art-state-opacity);
  transform:scale(1);
}
</style>
</head>
<body>

<div class="wrap" id="wrapEl">
  <div class="mask">
    <div class="state" id="stateEl">
<svg width="80" height="80" viewBox="0 0 24 24" fill="#ffffff">
<path d="M9.5 9.325v5.35q0 .575.525.875t1.025-.05l4.15-2.65q.475-.3.475-.85t-.475-.85L11.05 8.5q-.5-.35-1.025-.05t-.525.875ZM12 22q-2.075 0-3.9-.788t-3.175-2.137q-1.35-1.35-2.137-3.175T2 12q0-2.075.788-3.9t2.137-3.175q1.35-1.35 3.175-2.137T12 2q2.075 0 3.9.788t3.175 2.137q1.35 1.35 2.138 3.175T22 12q0 2.075-.788 3.9t-2.137 3.175q-1.35 1.35-3.175 2.138T12 22Z" />
</svg>
    </div>
  </div>
</div>

<script>
const wrapEl = document.getElementById('wrapEl');
let isPaused = true;

// 初始状态：暂停，带上class，图标显示
wrapEl.classList.add('art‑mask‑show');

// 模拟播放器真实逻辑：不要在一次click同时做 add+remove
wrapEl.onclick = function(){
  if(isPaused){
    // 当前暂停，点击 → 切换播放：移除class，触发【放大淡出动画】
    isPaused = false;
    wrapEl.classList.remove('art‑mask‑show');
  }else{
    // 当前播放，点击 → 切换暂停：增加class，触发【图标缩回来淡入】
    isPaused = true;
    // ✅关键：用 requestAnimationFrame 隔开两次渲染帧，防止浏览器合并
    requestAnimationFrame(()=>{
      wrapEl.classList.add('art‑mask‑show');
    })
  }
}
</script>
</body>
</html>
