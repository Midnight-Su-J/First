<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>本地Web播放器</title>
    <style>
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        html, body { margin: 0; }
        body {
            background: #1a1a1a center/cover no-repeat fixed;
        }

        /* 左上角背景栏展开/收起按钮 */
        #bgToggle {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1000;
            padding: 6px 14px;
            border: 1px solid rgba(255, 255, 255, .4);
            border-radius: 6px;
            background: rgba(0, 0, 0, .55);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all .2s;
        }
        #bgToggle:hover { background: #23ade5; border-color: #23ade5; }

        /* 背景切换栏（固定悬浮，默认收起） */
        .bg-switcher {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 900;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(0, 0, 0, .45);
            backdrop-filter: blur(8px);
            transform: translateY(-100%);
            transition: transform .3s;
        }
        .bg-switcher.open { transform: translateY(0); }
        .bg-switcher button {
            padding: 6px 16px;
            border: 1px solid rgba(255, 255, 255, .4);
            border-radius: 6px;
            background: rgba(255, 255, 255, .12);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all .2s;
        }
        .bg-switcher button:hover { background: rgba(255, 255, 255, .25); }
        .bg-switcher button.active { background: #23ade5; border-color: #23ade5; }

        /* 第一屏：播放器（比居中位置偏上一些） */
        .screen1 {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .player-wrap {
            position: relative;
            width: min(92vw, 1200px, calc((100vh - 170px) * 1.5));
            aspect-ratio: 3 / 2;
            margin-top: -20px;
        }
        #player {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .55);
        }

        /* 紧贴播放器左下角的按钮行 */
        .btn-row {
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-row button {
            padding: 8px 18px;
            border: 1px solid rgba(255, 255, 255, .4);
            border-radius: 6px;
            background: rgba(0, 0, 0, .55);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all .2s;
        }
        .btn-row button:hover:not(:disabled) { background: #23ade5; border-color: #23ade5; }
        .btn-row button:disabled { opacity: .6; cursor: wait; }

        /* 当前播放标题（按钮行下方） */
        .now-playing {
            position: absolute;
            top: calc(100% + 50px);
            left: 0;
            right: 0;
            color: #fff;
            font-size: 14px;
            line-height: 1.5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 4px rgba(0, 0, 0, .9);
        }
        .now-playing::before { content: "正在播放："; color: rgba(255, 255, 255, .7); }

        /* ffmpeg 封装提示：允许换行显示完整，10 秒后自动消失 */
        .remux-msg {
            position: absolute;
            top: calc(100% + 76px);
            left: 0;
            max-width: min(560px, 90vw);
            padding: 6px 12px;
            border-radius: 6px;
            background: rgba(0, 0, 0, .72);
            color: #fff;
            font-size: 13px;
            line-height: 1.5;
            white-space: normal;      /* 可以换行，保证提示完整 */
            word-break: break-all;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-4px);
            transition: opacity .25s, transform .25s, visibility .25s;
            pointer-events: none;
        }
        .remux-msg.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .remux-msg.ok { border-left: 3px solid #4caf50; }
        .remux-msg.err { border-left: 3px solid #ff5c5c; }
        .remux-msg.busy { border-left: 3px solid #23ade5; }

        /* 视觉隐藏但保持可访问的文件输入框 */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            clip-path: inset(50%);
            overflow: hidden;
            white-space: nowrap;
        }

        /* 第二屏：搜索栏 + 视频列表（两排三列，超出可内部滚动） */
        .screen2 {
            height: 100vh;
            padding: 24px 40px 40px;
            display: flex;
            flex-direction: column;
        }
        .search-bar {
            flex: none;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }
        #videoSearch {
            flex: 1;
            max-width: 480px;
            padding: 9px 16px;
            border: 1px solid rgba(255, 255, 255, .35);
            border-radius: 8px;
            background: rgba(0, 0, 0, .5);
            color: #fff;
            font-size: 14px;
            backdrop-filter: blur(8px);
            outline: none;
            transition: border-color .2s;
        }
        #videoSearch::placeholder { color: rgba(255, 255, 255, .55); }
        #videoSearch:focus { border-color: #23ade5; }
        #folderBtn, #nativeFolderBtn {
            flex: none;
            padding: 9px 16px;
            border: 1px solid rgba(255, 255, 255, .35);
            border-radius: 8px;
            background: rgba(0, 0, 0, .5);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all .2s;
        }
        #folderBtn:hover, #nativeFolderBtn:hover { background: #23ade5; border-color: #23ade5; }
        /* 当前媒体目录路径 */
        .current-path {
            flex: none;
            margin: -6px 0 12px;
            color: rgba(255, 255, 255, .7);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .current-path::before { content: "当前目录："; color: rgba(255, 255, 255, .5); }

        /* 文件夹选择弹窗 */
        .folder-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .55);
            backdrop-filter: blur(3px);
        }
        .folder-modal.open { display: flex; }
        .folder-dialog {
            width: min(620px, 92vw);
            max-height: 78vh;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            background: #1f2227;
            color: #eee;
            box-shadow: 0 18px 60px rgba(0, 0, 0, .6);
            overflow: hidden;
        }
        .folder-head {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            font-size: 16px;
            background: #262a30;
        }
        .folder-head button {
            border: none;
            background: none;
            color: #ccc;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
        }
        .folder-head button:hover { color: #fff; }
        .folder-toolbar {
            flex: none;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, .08);
        }
        .folder-toolbar button {
            padding: 5px 12px;
            border: 1px solid rgba(255, 255, 255, .25);
            border-radius: 6px;
            background: rgba(255, 255, 255, .06);
            color: #eee;
            font-size: 13px;
            cursor: pointer;
        }
        .folder-toolbar button:hover:not(:disabled) { background: #23ade5; border-color: #23ade5; }
        .folder-toolbar button:disabled { opacity: .4; cursor: default; }
        .folder-drives { display: flex; gap: 6px; flex-wrap: wrap; }
        .drive-btn {
            padding: 5px 10px !important;
        }
        .drive-btn.active { background: #23ade5 !important; border-color: #23ade5 !important; }
        .folder-cwd {
            flex: none;
            padding: 8px 16px;
            font-size: 12px;
            color: rgba(255, 255, 255, .65);
            background: rgba(0, 0, 0, .25);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .folder-list {
            flex: 1;
            min-height: 180px;
            overflow-y: auto;
            padding: 6px 0;
        }
        .folder-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 9px 18px;
            border: none;
            background: none;
            color: #e6e6e6;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
        }
        .folder-item:hover, .folder-item.selected { background: rgba(35, 173, 229, .22); }
        .folder-item .ficon { width: 20px; text-align: center; }
        /* 文件模式下的视频文件行：与文件夹视觉分组并高亮 */
        .folder-item.is-file { color: #8fd8f2; border-top: 1px solid rgba(255,255,255,.06); }
        .folder-item.is-file:hover { color: #bfeaff; }
        .folder-empty { padding: 30px 18px; text-align: center; color: #888; font-size: 13px; }
        .folder-foot {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            border-top: 1px solid rgba(255, 255, 255, .08);
        }
        #folderHint { font-size: 12px; color: #999; }
        .folder-foot button {
            padding: 7px 16px;
            border: 1px solid rgba(255, 255, 255, .25);
            border-radius: 6px;
            background: rgba(255, 255, 255, .06);
            color: #eee;
            font-size: 13px;
            cursor: pointer;
        }
        .folder-foot button:hover { background: rgba(255, 255, 255, .15); }
        .folder-foot button.primary { background: #23ade5; border-color: #23ade5; color: #fff; }
        #searchCount {
            color: rgba(255, 255, 255, .85);
            font-size: 13px;
            white-space: nowrap;
            text-shadow: 0 1px 4px rgba(0, 0, 0, .8);
        }
        .video-grid {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            /* 行高用 vh 绝对单位，不依赖 flex/grid 高度传递，兼容旧内核 */
            grid-auto-rows: calc((100vh - 140px) / 2);
            gap: 16px;
            padding: 4px;
        }
        .empty-tip {
            display: none;
            grid-column: 1 / -1;
            align-self: center;
            text-align: center;
            color: rgba(255, 255, 255, .8);
            font-size: 15px;
        }
        .video-card {
            appearance: none;
            position: relative;
            padding: 0;
            font: inherit;
            background: #161616; /* 不透明底色，任何情况下都不会透出页面背景 */
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform .2s, border-color .2s;
        }
        .video-card:hover { transform: translateY(-3px); border-color: #23ade5; }
        .card-cover {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 34px; /* 底部留给标题栏 */
            overflow: hidden;
            background: #222;
        }
        .card-cover img {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* 封面实在无法加载时的纯色占位（区别于“透出背景图”） */
        .card-cover.cover-failed {
            background: #2a2a2a;
        }
        .card-cover.cover-failed::after {
            content: "无封面";
            position: absolute;
            top: 50%; left: 0; right: 0;
            transform: translateY(-50%);
            text-align: center;
            color: #888;
            font-size: 14px;
        }
        .card-name {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 34px;
            line-height: 34px;
            padding: 0 10px;
            color: #fff;
            font-size: 13px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: rgba(0, 0, 0, .65);
        }

        /* 第三屏：背景图欣赏 */
        .screen3 {
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: rgba(0, 0, 0, .35);
        }
        #galleryImg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: rgba(0, 0, 0, .5);
        }
        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            width: 56px;
            height: 56px;
            border: 1px solid rgba(255, 255, 255, .4);
            border-radius: 50%;
            background: rgba(0, 0, 0, .5);
            color: #fff;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all .2s;
        }
        .gallery-arrow:hover { background: #23ade5; border-color: #23ade5; }
        #prevBg { left: 24px; }
        #nextBg { right: 24px; }
        #galleryName {
            position: absolute;
            bottom: 24px;
            left: 0;
            right: 0;
            text-align: center;
            color: #fff;
            font-size: 14px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, .8);
        }
    </style>
</head>
<body>
    <button id="bgToggle">背景栏 ▼</button>

    <div class="bg-switcher" id="bgSwitcher">
        <button data-bg="2233.jpg" class="active">2233</button>
        <button data-bg="白金.png">白金</button>
        <button data-bg="白黑.png">白黑</button>
        <button data-bg="warma.jpg">warma</button>
        <button id="customBgBtn">自定义 +</button>
        <input type="file" id="customBgInput" accept="image/*" class="sr-only">
    </div>

    <section class="screen1">
        <div class="player-wrap">
            <div id="player"></div>
            <div class="btn-row">
                <button id="fileBtn" type="button">选择视频文件</button>
                <button id="nativeFileBtn" type="button">选择本地文件</button>
                <button id="remuxBtn" type="button">ffmpeg 封装</button>
                <input type="file" id="remuxInput" class="sr-only"
                       accept=".mp4,.ts,.m2ts,.mts,.mkv,.flv,.avi,.mov,.wmv,.m4v,.webm,.ogv,video/*">
                <input type="file" id="nativeFileInput" class="sr-only"
                       accept=".mp4,.m4v,.webm,.ogv,.ogg,.mkv,video/*">
            </div>
            <div class="now-playing" id="nowPlaying" title=""></div>
            <div class="remux-msg" id="remuxStatus"></div>
        </div>
    </section>

    <section class="screen2">
        <div class="search-bar">
            <button id="folderBtn" type="button">选择文件夹</button>
            <button id="nativeFolderBtn" type="button">选择本地文件夹</button>
            <input type="file" id="nativeFolderInput" class="sr-only" webkitdirectory>
            <input type="search" id="videoSearch" placeholder="搜索当前文件夹里的视频…" autocomplete="off">
            <span id="searchCount"></span>
        </div>
        <div class="current-path" id="currentPath" title=""></div>
        <div class="video-grid" id="videoGrid">
            <div class="empty-tip" id="emptyTip">没有匹配的视频</div>
        </div>
    </section>

    <!-- 第三屏：背景图欣赏 -->
    <section class="screen3">
        <img id="galleryImg" alt="背景图">
        <button class="gallery-arrow" id="prevBg" type="button">←</button>
        <button class="gallery-arrow" id="nextBg" type="button">→</button>
        <div id="galleryName"></div>
    </section>

    <!-- 文件夹选择弹窗（服务端目录浏览） -->
    <div class="folder-modal" id="folderModal">
        <div class="folder-dialog">
            <div class="folder-head">
                <span id="folderTitle">选择视频文件夹</span>
                <button id="folderClose" type="button" title="关闭">×</button>
            </div>
            <div class="folder-toolbar">
                <button id="folderUp" type="button">↑ 上级</button>
                <div class="folder-drives" id="folderDrives"></div>
            </div>
            <div class="folder-cwd" id="folderCwd"></div>
            <div class="folder-list" id="folderList"></div>
            <div class="folder-foot">
                <span id="folderHint">单击进入文件夹，选中后点“使用此文件夹”</span>
                <div id="folderActions">
                    <button id="folderCancel" type="button">取消</button>
                    <button id="folderOk" type="button" class="primary">使用此文件夹</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./artplayer.min.js"></script>
    <script>
        // ===== 自定义播放速度：一般倍速（≤3）/ 其他倍速（>3）=====
        function rateLabel(v) {
            // 1.0 显示为“1.0x”，其余按数值自然显示（2x、2.25x、4x…）
            return (v === 1 ? '1.0' : String(v)) + 'x';
        }
        function makeRateItem(v) {
            return {
                html: rateLabel(v),
                value: v,
                default: v === 1, // 1.0x 为当前档
            };
        }
        // 选中档位后应用倍速；两组完全互斥：另一组既不显示数字，也不保留上次的勾选
        function applyRate(item) {
            art.playbackRate = item.value;
            var group = item.$parent;          // 一般倍速 / 其他倍速
            rateGroups.forEach(function (g) {
                // 选中组显示倍速，另一组清空数字
                g.tooltip = (g === group) ? item.html : '';
                g.selector.forEach(function (leaf) {
                    // 同步 default 标记（面板尚未渲染时据此决定初始勾选）
                    leaf.default = (leaf === item);
                    // 面板已经渲染过时，直接同步勾选样式，避免旧勾选残留
                    if (leaf.$item) leaf.$item.classList.toggle('art-current', leaf === item);
                });
            });
            if (group && group.$parent) group.$parent.tooltip = item.html;
            return item.html;
        }
        var normalRateValues = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.25, 2.5, 2.75, 3];
        var otherRateValues = [3.25, 3.5, 3.75, 4, 5, 6, 7, 8];
        var rateGroups = [
            {
                html: '一般倍速',
                width: 180,
                selector: normalRateValues.map(makeRateItem),
                onSelect: applyRate,
            },
            {
                html: '其他倍速',
                width: 180,
                selector: otherRateValues.map(makeRateItem),
                onSelect: applyRate,
            },
        ];

        var art = new Artplayer({
            container: '#player',
            url: '', // 默认不加载任何视频，由用户从列表/文件选择播放
            volume: 0.5,
            muted: false,
            autoplay: false,
            pip: true,
            screenshot: true,
            setting: true,
            loop: true,
            playbackRate: false, // 关闭内置倍速菜单，使用下面的分组自定义菜单
            fullscreen: true,
            fullscreenWeb: true,
            theme: '#23ade5',
            lang: navigator.language.toLowerCase(),
            moreVideoAttr: {
                crossOrigin: 'anonymous',
            },
            // 空数组 = 关闭右键菜单，如果你想要自定义右键，可以往数组里添加菜单对象
            contextmenu: [],
            // 设置面板：播放速度 → 一般倍速 / 其他倍速 → 具体档位
            settings: [
                {
                    html: '播放速度',
                    tooltip: '1.0x',
                    width: 180,
                    selector: rateGroups,
                },
            ],
        });

        // ===== 当前播放标题 =====
        var nowPlaying = document.getElementById('nowPlaying');
        function setNowPlaying(title) {
            nowPlaying.textContent = title || '未选择视频';
            nowPlaying.title = title || '';
        }
        function titleOf(name) {
            // 去掉扩展名作为显示标题
            return name.replace(/\.[^.]+$/, '');
        }
        setNowPlaying('');

        // ===== ffmpeg 封装临时提示（单例 timer，10 秒自动消失） =====
        var remuxMsgEl = document.getElementById('remuxStatus');
        var remuxMsgTimer = null;
        function showRemuxMsg(text, kind) {
            clearTimeout(remuxMsgTimer);
            remuxMsgEl.textContent = text;
            remuxMsgEl.className = 'remux-msg show ' + (kind || 'ok');
            // 封装中不自动消失；成功/失败 10 秒后消失
            if (kind !== 'busy') {
                remuxMsgTimer = setTimeout(function () {
                    remuxMsgEl.classList.remove('show');
                }, 10000);
            }
        }

        // ===== 网页背景切换 =====
        var currentBg = '2233.jpg'; // 当前背景，也用作无封面视频卡的兜底图
        var bgButtons = document.querySelectorAll('.bg-switcher button[data-bg]');

        // blob: 地址（本地选择的图片）不能做 URL 编码
        function bgUrl(name) {
            return name.indexOf('blob:') === 0 ? name : encodeURIComponent(name);
        }

        function applyBg(name) {
            currentBg = name;
            document.body.style.backgroundImage = 'url("' + bgUrl(name) + '")';
            // 封面加载失败时使用纯色“无封面”占位，与背景图无关，无需同步
        }

        function setActiveBgButton(btn) {
            document.querySelectorAll('.bg-switcher button').forEach(function (b) {
                b.classList.remove('active');
            });
            if (btn) btn.classList.add('active');
        }

        bgButtons.forEach(function (btn) {
            btn.addEventListener('click', function () {
                setActiveBgButton(btn);
                applyBg(btn.dataset.bg);
            });
        });
        // 默认使用第一张背景
        applyBg(currentBg);

        // ===== 自定义背景（选本地图片作为背景） =====
        var customBgBtn = document.getElementById('customBgBtn');
        var customBgInput = document.getElementById('customBgInput');
        var customBgUrl = null;

        customBgBtn.addEventListener('click', function () { customBgInput.click(); });
        customBgInput.addEventListener('change', function () {
            var file = this.files[0];
            if (!file) return;
            if (customBgUrl) URL.revokeObjectURL(customBgUrl);
            customBgUrl = URL.createObjectURL(file);
            setActiveBgButton(customBgBtn);
            applyBg(customBgUrl);
            rebuildBgList();
            // 画廊跳到新添加的自定义图
            showGallery(bgImages.length - 1);
            this.value = ''; // 允许重复选择同一张图片
        });

        // ===== 第三屏：背景图欣赏 =====
        var bgImages = [];      // 全部可欣赏的背景图（内置 + 自定义）
        var galleryIndex = 0;
        var galleryImg = document.getElementById('galleryImg');
        var galleryName = document.getElementById('galleryName');

        function rebuildBgList() {
            bgImages = Array.prototype.map.call(
                document.querySelectorAll('.bg-switcher button[data-bg]'),
                function (b) { return b.dataset.bg; }
            );
            if (customBgUrl) bgImages.push(customBgUrl);
        }

        function showGallery(i) {
            if (!bgImages.length) return;
            galleryIndex = (i + bgImages.length) % bgImages.length;
            var name = bgImages[galleryIndex];
            galleryImg.src = bgUrl(name);
            galleryName.textContent = name.indexOf('blob:') === 0
                ? '自定义背景'
                : name.replace(/\.[^.]+$/, '');
        }

        document.getElementById('prevBg').addEventListener('click', function () {
            showGallery(galleryIndex - 1);
        });
        document.getElementById('nextBg').addEventListener('click', function () {
            showGallery(galleryIndex + 1);
        });

        rebuildBgList();
        showGallery(0);

        // ===== 背景栏展开/收起（默认收起） =====
        var bgToggle = document.getElementById('bgToggle');
        var bgSwitcher = document.getElementById('bgSwitcher');
        bgToggle.addEventListener('click', function () {
            var opened = bgSwitcher.classList.toggle('open');
            bgToggle.textContent = opened ? '背景栏 ▲' : '背景栏 ▼';
        });

        // ===== 选择视频文件 =====
        // 浏览器安全限制下网页拿不到本地文件的完整路径，
        // 因此改为打开服务端目录浏览器（文件模式）：
        // 点选某个视频后，媒体目录一并切换到它所在的文件夹，下方列表同步。
        var fileBtn = document.getElementById('fileBtn');
        var currentObjectUrl = null; // 原生 File 播放时的临时 blob 地址
        fileBtn.addEventListener('click', function () { openFileModal(); });

        // ===== 本地选择文件（浏览器原生文件框，file:// 直开也可用） =====
        // 浏览器安全限制拿不到文件完整路径，但原生文件框返回的 File 对象
        // 可以转成 blob: 地址直接交给播放器，无需任何后端。
        var nativeFileBtn = document.getElementById('nativeFileBtn');
        var nativeFileInput = document.getElementById('nativeFileInput');
        nativeFileBtn.addEventListener('click', function () { nativeFileInput.click(); });
        nativeFileInput.addEventListener('change', function () {
            var file = this.files[0];
            this.value = ''; // 允许重复选择同一个文件
            if (!file) return;
            playItem({ name: file.name, title: titleOf(file.name), url: null, nativeFile: file });
        });

        // ===== ffmpeg 无损转封装（系统文件框选视频，成品输出到当前视频列表目录） =====
        var remuxBtn = document.getElementById('remuxBtn');
        var remuxInput = document.getElementById('remuxInput');

        remuxBtn.addEventListener('click', function () { remuxInput.click(); });
        remuxInput.addEventListener('change', function () {
            var file = this.files[0];
            this.value = ''; // 允许重复选择同一个文件
            if (!file) return;

            var btnText = remuxBtn.textContent;
            remuxBtn.disabled = true;
            remuxBtn.textContent = '封装中…';
            showRemuxMsg('正在封装「' + file.name + '」，请稍候…', 'busy');

            // 文件名通过请求头传递，请求体为文件原始字节
            fetch('/api/remux', {
                method: 'POST',
                headers: { 'X-Filename': encodeURIComponent(file.name) },
                body: file,
            })
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    if (data.ok) {
                        showRemuxMsg('封装完成：' + data.name, 'ok');
                        window.__thumbVersion = Date.now(); // 跳过浏览器旧缩略图缓存
                        loadVideos(false); // 刷新当前列表，成品已在列表目录中
                        // 直接播放刚封装好的视频
                        if (currentObjectUrl) {
                            URL.revokeObjectURL(currentObjectUrl);
                            currentObjectUrl = null;
                        }
                        art.switchUrl(encodeURIComponent(data.name));
                        setNowPlaying(titleOf(data.name));
                    } else {
                        var err = (data.error || '未知错误');
                        if (err.length > 120) err = err.slice(0, 120) + '…';
                        showRemuxMsg('封装失败：' + err, 'err');
                    }
                })
                .catch(function (err) {
                    showRemuxMsg('请求失败：' + err.message, 'err');
                })
                .finally(function () {
                    remuxBtn.disabled = false;
                    remuxBtn.textContent = btnText;
                });
        });

        // ===== file:// 模式：原生选择的视频列表与客户端缩略图 =====
        // file:// 下没有 ffmpeg 后端，改用隐藏 <video> 抽帧画到 canvas 生成封面。
        var NATIVE_VIDEO_EXTS = ['.mp4', '.m4v', '.webm', '.ogv', '.ogg', '.mkv'];
        // blob: 方式无法解析 HLS 播放列表，因此不含 .m3u8

        function extOf(name) {
            var i = name.lastIndexOf('.');
            return i === -1 ? '' : name.slice(i).toLowerCase();
        }

        var thumbQueue = [];      // 待生成缩略图的 item 队列
        var thumbRunning = 0;     // 并发上限 2，避免大量视频同时解码占满资源
        var THUMB_MAX_PARALLEL = 2;

        function queueNativeThumb(item, img, cover) {
            (item._thumbImgs = item._thumbImgs || []).push({ img: img, cover: cover });
            if (item._queued) return;
            item._queued = true;
            thumbQueue.push(item);
            pumpNativeThumbs();
        }

        function pumpNativeThumbs() {
            while (thumbRunning < THUMB_MAX_PARALLEL && thumbQueue.length) {
                var item = thumbQueue.shift();
                if (item._thumbData) { deliverNativeThumb(item); continue; }
                thumbRunning++;
                genNativeThumb(item.nativeFile, function (it) {
                    return function (dataUrl) {
                        thumbRunning--;
                        if (dataUrl) {
                            it._thumbData = dataUrl;
                            deliverNativeThumb(it);
                        } else {
                            it._thumbImgs.forEach(function (r) {
                                r.cover.classList.add('cover-failed');
                            });
                        }
                        pumpNativeThumbs();
                    };
                }(item));
            }
        }

        function deliverNativeThumb(item) {
            item._thumbImgs.forEach(function (r) { r.img.src = item._thumbData; });
        }

        function genNativeThumb(file, cb) {
            var url = URL.createObjectURL(file);
            var v = document.createElement('video');
            v.muted = true;
            v.preload = 'metadata';
            var done = false;
            var timer = setTimeout(function () { finish(null); }, 8000);
            function finish(dataUrl) {
                if (done) return;
                done = true;
                clearTimeout(timer);
                URL.revokeObjectURL(url);
                v.removeAttribute('src');
                try { v.load(); } catch (e) {}
                cb(dataUrl);
            }
            v.addEventListener('error', function () { finish(null); });
            v.addEventListener('loadedmetadata', function () {
                // 优先取 3s 处画面（避开开头黑屏）；短视频取中间
                var d = v.duration;
                var t = (isFinite(d) && d > 0) ? Math.min(3, d / 2) : 3;
                try { v.currentTime = t; } catch (e) { finish(null); }
            });
            v.addEventListener('seeked', function () {
                try {
                    var c = document.createElement('canvas');
                    c.width = 480;
                    c.height = Math.max(1, Math.round(v.videoHeight * 480 / v.videoWidth) || 270);
                    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
                    finish(c.toDataURL('image/jpeg', 0.75));
                } catch (e) { finish(null); }
            });
            v.src = url;
        }

        // ===== 第二屏：当前媒体目录的视频列表 + 搜索 =====
        var videoItems = [];
        var mediaPath = '';
        var searchInput = document.getElementById('videoSearch');
        var searchCount = document.getElementById('searchCount');
        var emptyTip = document.getElementById('emptyTip');
        var videoGrid = document.getElementById('videoGrid');
        var currentPathEl = document.getElementById('currentPath');

        // 统一播放入口：原生 File 现场生成 blob 地址 → 释放旧地址 → 切换 → 更新标题 → 滚回顶部
        function playItem(item) {
            if (item.nativeFile && !item.url) {
                item.url = URL.createObjectURL(item.nativeFile);
            }
            if (currentObjectUrl) {
                URL.revokeObjectURL(currentObjectUrl);
                currentObjectUrl = null;
            }
            if (item.url && item.url.indexOf('blob:') === 0) {
                currentObjectUrl = item.url; // 记录下来，下次播放前释放
            }
            art.switchUrl(item.url);
            setNowPlaying(item.title);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderGrid() {
            // 清空旧卡片但保留“无匹配”提示节点
            videoGrid.querySelectorAll('.video-card').forEach(function (c) { c.remove(); });

            videoItems.forEach(function (item) {
                var card = document.createElement('button');
                card.type = 'button';
                card.className = 'video-card';
                card.dataset.name = item.name; // 完整文件名，供搜索

                var cover = document.createElement('div');
                cover.className = 'card-cover';
                var thumb = document.createElement('img');
                thumb.alt = '';
                cover.appendChild(thumb);

                // 静态 .jpg，首次可能还在后台生成（404），自动重试
                var retry = 0;
                function setSrc() {
                    thumb.src = item.thumb
                        + (item.thumb.indexOf('?') === -1 ? '?' : '&')
                        + 'v=' + (window.__thumbVersion || 0)
                        + '&t=' + retry;
                }
                if (item.thumb) {
                    // 服务端模式：静态 .jpg，首次可能还在后台生成（404），自动重试
                    thumb.addEventListener('error', function () {
                        if (retry < 8) {
                            retry++;
                            setTimeout(setSrc, 600);
                        } else {
                            cover.classList.add('cover-failed');
                        }
                    });
                    setSrc();
                } else if (item.nativeFile) {
                    // file:// 模式：客户端抽帧生成缩略图
                    queueNativeThumb(item, thumb, cover);
                } else {
                    cover.classList.add('cover-failed');
                }

                // 标题：保留前缀名
                var label = document.createElement('div');
                label.className = 'card-name';
                label.textContent = item.title;
                label.title = item.name;

                card.appendChild(cover);
                card.appendChild(label);
                card.addEventListener('click', function () { playItem(item); });
                videoGrid.appendChild(card);
            });
            applyFilter();
        }

        // 模糊匹配：忽略英文大小写；关键词各字符按顺序出现即可（少字也能中），
        // 目标中允许夹杂任意其他字符（多字也能中）；空格分隔的多个关键词需依次命中。
        // 例："jz" 可命中 "Jazz"，"小女 2" 可命中 "《小女ラムネ》第2話…"。
        function fuzzyHit(rawQuery, rawText) {
            var tokens = rawQuery.toLowerCase().trim().split(/\s+/).filter(Boolean);
            if (!tokens.length) return true;
            var text = String(rawText).toLowerCase();
            var pos = 0;
            for (var t = 0; t < tokens.length; t++) {
                var token = tokens[t];
                for (var i = 0; i < token.length; i++) {
                    pos = text.indexOf(token.charAt(i), pos);
                    if (pos === -1) return false;
                    pos++;
                }
            }
            return true;
        }

        function applyFilter() {
            var kw = searchInput.value.trim();
            var shown = 0;
            videoGrid.querySelectorAll('.video-card').forEach(function (card) {
                var hit = fuzzyHit(kw, card.dataset.name);
                card.style.display = hit ? '' : 'none';
                if (hit) shown++;
            });
            emptyTip.style.display = shown === 0 ? 'block' : 'none';
            searchCount.textContent = kw
                ? '找到 ' + shown + ' / ' + videoItems.length + ' 个视频'
                : '共 ' + videoItems.length + ' 个视频';
        }

        searchInput.addEventListener('input', applyFilter);

        // 释放当前列表里原生 File 的 blob 地址（切换列表时调用，避免内存泄漏）
        function releaseNativeItems() {
            if (currentObjectUrl) {
                URL.revokeObjectURL(currentObjectUrl);
                currentObjectUrl = null;
            }
            videoItems.forEach(function (it) {
                if (it.nativeFile && it.url) {
                    URL.revokeObjectURL(it.url);
                    it.url = null;
                }
            });
        }

        function setVideoList(data, autoPlayFirst) {
            releaseNativeItems();
            mediaPath = data.path || '';
            currentPathEl.textContent = mediaPath;
            currentPathEl.title = mediaPath;
            videoItems = (data.items || []).map(function (it) {
                return {
                    name: it.name,
                    title: titleOf(it.name),
                    url: encodeURIComponent(it.name),
                    thumb: it.thumb,
                };
            });
            renderGrid();

            // 切换文件夹后自动播放第一个；初始加载时保持播放器为空
            if (autoPlayFirst && videoItems.length) {
                if (currentObjectUrl) {
                    URL.revokeObjectURL(currentObjectUrl);
                    currentObjectUrl = null;
                }
                art.switchUrl(videoItems[0].url);
                setNowPlaying(videoItems[0].title);
            } else if (autoPlayFirst === false && !videoItems.length) {
                setNowPlaying('');
            }
        }

        function loadVideos(autoPlayFirst) {
            fetch('/api/videos')
            .then(function (res) { return res.json(); })
            .then(function (data) { setVideoList(data, autoPlayFirst); });
        }

        // ===== 选择文件夹：弹出服务端目录浏览器，切换当前媒体目录 =====
        var folderModal = document.getElementById('folderModal');
        var folderListEl = document.getElementById('folderList');
        var folderCwdEl = document.getElementById('folderCwd');
        var folderDrivesEl = document.getElementById('folderDrives');
        var folderUpBtn = document.getElementById('folderUp');
        var folderOkBtn = document.getElementById('folderOk');
        var browsePath = '';   // 弹窗当前浏览到的目录
        var browseParent = null;
        var browseMode = 'folder'; // folder=选文件夹；file=选视频文件

        // 拼接目录 + 名称（统一用反斜杠，去掉尾部多余斜杠）
        function joinPath(base, name) {
            return String(base).replace(/[\\/]*$/, '') + '\\' + name;
        }
        var folderTitleEl = document.getElementById('folderTitle');
        var folderActionsEl = document.getElementById('folderActions');
        var folderHint = document.getElementById('folderHint');

        function openFolderModal() {
            browseMode = 'folder';
            folderTitleEl.textContent = '选择视频文件夹';
            folderHint.textContent = '单击进入文件夹，选中后点“使用此文件夹”';
            folderActionsEl.style.display = '';
            folderModal.classList.add('open');
            browseDir(mediaPath || '');
        }
        function openFileModal() {
            browseMode = 'file';
            folderTitleEl.textContent = '选择视频文件';
            folderHint.textContent = '单击文件夹进入，直接点击视频文件即可播放，下方列表会同步切换';
            folderActionsEl.style.display = 'none';
            folderModal.classList.add('open');
            browseDir(mediaPath || '');
        }
        function closeFolderModal() {
            folderModal.classList.remove('open');
        }

        function browseDir(path) {
            var url = '/api/browse' + (path ? '?path=' + encodeURIComponent(path) : '');
            fetch(url)
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (!data.ok) {
                    folderListEl.innerHTML =
                        '<div class="folder-empty">' + (data.error || '无法读取目录') + '</div>';
                    return;
                }
                browsePath = data.path;
                browseParent = data.parent;
                folderCwdEl.textContent = data.path;
                folderUpBtn.disabled = !data.canUp;

                // 盘符
                folderDrivesEl.innerHTML = '';
                data.drives.forEach(function (d) {
                    var b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'drive-btn' +
                        (data.path.toLowerCase().indexOf(d.toLowerCase()) === 0 ? ' active' : '');
                    b.textContent = d.replace('\\', '');
                    b.addEventListener('click', function () { browseDir(d); });
                    folderDrivesEl.appendChild(b);
                });

                // 子目录
                folderListEl.innerHTML = '';
                data.dirs.forEach(function (name) {
                    var row = document.createElement('button');
                    row.type = 'button';
                    row.className = 'folder-item';
                    var icon = document.createElement('span');
                    icon.className = 'ficon';
                    icon.textContent = '📁';
                    var text = document.createElement('span');
                    text.textContent = name;
                    row.appendChild(icon);
                    row.appendChild(text);
                    // 单击进入；双击也进入（兼容习惯）
                    row.addEventListener('click', function () {
                        browseDir(joinPath(data.path, name));
                    });
                    folderListEl.appendChild(row);
                });

                // 文件模式：追加当前目录下的视频文件，点击即切换目录并播放
                if (browseMode === 'file') {
                    (data.files || []).forEach(function (name) {
                        var row = document.createElement('button');
                        row.type = 'button';
                        row.className = 'folder-item is-file';
                        var icon = document.createElement('span');
                        icon.className = 'ficon';
                        icon.textContent = '🎬';
                        var text = document.createElement('span');
                        text.textContent = name;
                        row.appendChild(icon);
                        row.appendChild(text);
                        row.addEventListener('click', function () { selectBrowseFile(name); });
                        folderListEl.appendChild(row);
                    });
                }

                if (!data.dirs.length && (browseMode !== 'file' || !(data.files || []).length)) {
                    var e = document.createElement('div');
                    e.className = 'folder-empty';
                    e.textContent = browseMode === 'file'
                        ? '该文件夹下没有子文件夹或视频文件'
                        : '该文件夹下没有子文件夹（仍可直接点“使用此文件夹”）';
                    folderListEl.appendChild(e);
                }
            });
        }

        // 文件模式：选中某个视频 → 把它所在文件夹设为媒体目录 → 刷新列表并直接播放
        function selectBrowseFile(name) {
            fetch('/api/set-root', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: browsePath }),
            })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (!data.ok) {
                    showRemuxMsg('切换失败：' + (data.error || '未知错误'), 'err');
                    return;
                }
                closeFolderModal();
                searchInput.value = ''; // 切换目录后清空搜索词
                loadVideos(false);      // 刷新成该文件夹的视频列表（不自动播第一个）
                playItem({              // 直接播放选中的文件
                    name: name,
                    title: titleOf(name),
                    url: encodeURIComponent(name),
                });
                showRemuxMsg('已切换到：' + data.path, 'ok');
            })
            .catch(function (err) {
                showRemuxMsg('请求失败：' + err.message, 'err');
            });
        }

        document.getElementById('folderBtn').addEventListener('click', openFolderModal);
        document.getElementById('folderClose').addEventListener('click', closeFolderModal);
        document.getElementById('folderCancel').addEventListener('click', closeFolderModal);
        folderModal.addEventListener('click', function (e) {
            if (e.target === folderModal) closeFolderModal();
        });
        folderUpBtn.addEventListener('click', function () {
            if (browseParent) browseDir(browseParent);
        });
        folderOkBtn.addEventListener('click', function () {
            folderOkBtn.disabled = true;
            fetch('/api/set-root', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: browsePath }),
            })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                folderOkBtn.disabled = false;
                if (!data.ok) {
                    showRemuxMsg('切换失败：' + (data.error || '未知错误'), 'err');
                    return;
                }
                closeFolderModal();
                searchInput.value = ''; // 切换目录后清空搜索词
                loadVideos(true); // 拉取新目录列表（含封面）并自动播放第一个
                showRemuxMsg('已切换到：' + data.path + '（' + data.videos.length + ' 个视频）', 'ok');
            })
            .catch(function (err) {
                folderOkBtn.disabled = false;
                showRemuxMsg('请求失败：' + err.message, 'err');
            });
        });

        // ===== 本地选择文件夹（webkitdirectory 原生目录框，file:// 直开也可用） =====
        // 原生目录框会递归返回文件夹下所有文件，这里只取第一层的视频，
        // 与服务端“当前目录列表”的行为保持一致。
        var nativeFolderBtn = document.getElementById('nativeFolderBtn');
        var nativeFolderInput = document.getElementById('nativeFolderInput');
        nativeFolderBtn.addEventListener('click', function () { nativeFolderInput.click(); });
        nativeFolderInput.addEventListener('change', function () {
            // 先筛出目标文件（File 对象引用独立存在），再清空 input 以便重复选择
            var files = Array.prototype.filter.call(this.files, function (f) {
                var rel = f.webkitRelativePath || '';
                // "文件夹/文件.mp4" 只有 1 个斜杠 → 第一层；更深层跳过
                return rel.indexOf('/') === rel.lastIndexOf('/') &&
                       NATIVE_VIDEO_EXTS.indexOf(extOf(f.name)) !== -1;
            });
            this.value = '';
            if (!files.length) {
                showRemuxMsg('该文件夹第一层没有可直接播放的视频', 'err');
                return;
            }
            releaseNativeItems(); // 释放旧列表的 blob 地址
            var rel0 = files[0].webkitRelativePath || '';
            var folderName = rel0.indexOf('/') !== -1 ? rel0.split('/')[0] : '本地文件夹';
            mediaPath = folderName;
            currentPathEl.style.display = '';
            currentPathEl.textContent = folderName;
            currentPathEl.title = folderName;
            videoItems = files.map(function (f) {
                return { name: f.name, title: titleOf(f.name), url: null, thumb: null, nativeFile: f };
            });
            renderGrid();
            showRemuxMsg('已加载本地文件夹：' + folderName + '（' + files.length + ' 个视频）', 'ok');
        });

        // ===== file:// 直开模式：没有后端，隐藏依赖服务端的入口 =====
        var IS_FILE = location.protocol === 'file:';
        if (IS_FILE) {
            fileBtn.style.display = 'none';   // 服务端目录浏览器（需 /api/browse）
            document.getElementById('folderBtn').style.display = 'none';
            remuxBtn.style.display = 'none';  // 依赖 /api/remux
            currentPathEl.style.display = 'none';
            emptyTip.textContent = '请点击“本地选择文件夹”或“本地选择文件”添加视频';
        } else {
            loadVideos(false); // 初始加载只填列表，播放器保持为空
        }
    </script>
</body>
</html>
