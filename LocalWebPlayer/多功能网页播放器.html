<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<title>多功能网页播放器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
    color:#000;
    padding:20px;
    font-family:system-ui;
    transition: background-color 0.3s ease, color 0.2s;
    background:#ffffff;
}
.wrap{max-width:1100px;margin:0 auto;}

/* 主题选择区 */
.theme-panel{
    display:flex;
    gap:12px;
    margin-bottom:12px;
    align-items:center;
}
.theme-panel span{
    font-size:14px;
}
.theme-dot{
    width:28px;
    height:28px;
    border-radius:50%;
    cursor:pointer;
    border:2px solid transparent;
    transition: border-color 0.2s ease;
}
.theme-dot.active{
    border-color:#222222;
}

/* 播放器容器 16:9 */
.video-container{
    position:relative;
    background:#000;
    overflow:hidden;
    width:100%;
    aspect-ratio:16 / 9;
}
#myVideo{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
}

.controls{
    padding:10px;
    background:rgba(0,0,0,0.7);
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    transition: opacity 0.3s ease;
    z-index:999;
}
.controls.hidden{
    opacity:0;
    pointer-events:none;
}

input[type="range"]{cursor:pointer;}

.btn{
    padding:6px 12px;
    border-radius:4px;
    cursor:pointer;
    transition: background-color 0.2s ease, border 0.2s ease;
    background:#ffffff;
    color:#000;
    border:1px solid #000000;
}

.select-speed{
    padding:5px;
    border-radius:4px;
    cursor:pointer;
    transition: background-color 0.2s ease, border 0.2s ease;
    z-index:1000;
    background:#ffffff;
    color:#000;
    border:1px solid #000000;
}

.time{
    font-size:14px;
    min-width:110px;
    color:#fff;
}

/* 未载入视频提示 */
.empty-tip{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:#888;
    font-size:18px;
    pointer-events:none;
}

/* 隐藏原生文件上传按钮，用label模拟 */
#fileInput{
    display:none;
}
</style>
</head>
<body>
<div class="wrap">
    <div class="theme-panel">
        <span>主题色调：</span>
        <div class="theme-dot" style="background:#000000;" data-theme="#000000"></div>
        <div class="theme-dot active" style="background:#ffffff;" data-theme="#ffffff"></div>
        <div class="theme-dot" style="background:#888888;" data-theme="#888888"></div>
        <div class="theme-dot" style="background:#fb7299;" data-theme="#fb7299"></div>
        <div class="theme-dot" style="background:#4fb4d8;" data-theme="#4fb4d8"></div>
        <div class="theme-dot" style="background:#ffe135;" data-theme="#ffe135"></div>
    </div>

    <input type="file" id="fileInput" accept="video/*" />
    <label class="btn" for="fileInput">选择视频文件</label>

    <div class="video-container" id="videoContainer">
        <video id="myVideo"></video>
        <div class="empty-tip" id="emptyTip">请选择上方视频文件</div>
        <div class="controls" id="controls">
            <button class="btn" id="playBtn">播放</button>
            <input type="range" id="progress" min="0" max="100" value="0" style="flex:1;">
            <span class="time" id="timeText">00:00 / 00:00</span>
            <label style="color:#fff;">音量</label>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.6">
            <select class="select-speed" id="speedSelect">
                <option value="0.5">0.5x</option>
                <option value="0.75">0.75x</option>
                <option value="1" selected>1x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="2">2x</option>
                <option value="2.25">2.25x</option>
                <option value="2.5">2.5x</option>
                <option value="2.75">2.75x</option>
                <option value="3">3x</option>
            </select>
            <button class="btn" id="fullBtn">全屏</button>
        </div>
    </div>
</div>
<script>
const video = document.getElementById('myVideo');
const playBtn = document.getElementById('playBtn');
const progress = document.getElementById('progress');
const timeText = document.getElementById('timeText');
const volume = document.getElementById('volume');
const speedSelect = document.getElementById('speedSelect');
const fullBtn = document.getElementById('fullBtn');
const fileInput = document.getElementById('fileInput');
const controls = document.getElementById('controls');
const videoContainer = document.getElementById('videoContainer');
const emptyTip = document.getElementById('emptyTip');
const themeDots = document.querySelectorAll('.theme-dot');

let isDrag = false;
let hideTimer = null;
let currentTheme = "#ffffff";

// 初始化
applyTheme(currentTheme);
bindContainerEvents(videoContainer);

// 绑定容器鼠标事件，普通状态和全屏状态都要重新绑定
function bindContainerEvents(container){
    container.addEventListener('mousemove',(e)=>{
        const rect = container.getBoundingClientRect();
        const y = e.clientY - rect.top;
        const height = rect.height;

        if(y > height - 80){
            showControls();
        }
    });

    container.addEventListener('mouseleave',()=>{
        startHideCountDown();
    });
}

// 主题切换
themeDots.forEach(dot=>{
    dot.addEventListener('click',()=>{
        currentTheme = dot.dataset.theme;
        applyTheme(currentTheme);
        themeDots.forEach(d=>d.classList.remove('active'));
        dot.classList.add('active');
    })
})

function applyTheme(themeColor){
    document.body.style.backgroundColor = themeColor;

    let btnText = "#000";
    let btnBorder = "1px solid #000000";

    if(themeColor === "#000000"){
        btnText = "#fff";
        btnBorder = "1px solid #ffffff";
    }

    document.querySelectorAll('.btn').forEach(btn=>{
        btn.style.background = themeColor;
        btn.style.border = btnBorder;
        btn.style.color = btnText;
    });

    document.querySelectorAll('.select-speed').forEach(sl=>{
        sl.style.background = themeColor;
        sl.style.border = btnBorder;
        sl.style.color = btnText;
    });

    if(themeColor === "#ffffff"){
        document.body.style.color = "#000";
    }else{
        document.body.style.color = "#fff";
    }
}

// 显示控制栏
function showControls(){
    controls.classList.remove('hidden');
    clearTimeout(hideTimer);
}

// 开始倒计时隐藏：3秒
function startHideCountDown(){
    clearTimeout(hideTimer);
    hideTimer = setTimeout(()=>{
        controls.classList.add('hidden');
    },3000);
}

// 鼠标停在控件区域内不隐藏
controls.addEventListener('mouseenter',()=>{
    clearTimeout(hideTimer);
});

controls.addEventListener('mouseleave',()=>{
    startHideCountDown();
});

// 选择本地视频
fileInput.onchange = function(e){
    const file = e.target.files[0];
    if(!file) return;
    const objUrl = URL.createObjectURL(file);
    video.src = objUrl;
    emptyTip.style.display = 'none';
    playBtn.innerText = "暂停";
    video.play();
}

// 播放暂停
playBtn.onclick = function(){
    if(video.paused){
        video.play();
        playBtn.innerText = "暂停";
    }else{
        video.pause();
        playBtn.innerText = "播放";
    }
}

video.ontimeupdate = function(){
    if(isDrag) return;
    const per = (video.currentTime / video.duration) * 100;
    progress.value = per;
    timeText.innerText = format(video.currentTime) + " / " + format(video.duration);
}

progress.onmousedown = ()=> isDrag = true;
progress.onmouseup = function(){
    isDrag = false;
    const val = progress.value;
    video.currentTime = (val / 100) * video.duration;
}
progress.oninput = function(){
    if(isDrag){
        video.currentTime = (progress.value / 100) * video.duration;
    }
}

volume.oninput = function(){
    video.volume = volume.value;
}

speedSelect.onchange = function(){
    video.playbackRate = Number(speedSelect.value);
}

// 容器整体全屏，并重新绑定全屏容器事件
fullBtn.onclick = function(){
    if(document.fullscreenElement){
        document.exitFullscreen();
    }else{
        videoContainer.requestFullscreen();
    }
}

// 全屏变化时，重新绑定事件
document.addEventListener('fullscreenchange',()=>{
    const fullscreenEl = document.fullscreenElement;

    if(fullscreenEl){
        bindContainerEvents(fullscreenEl);
    }else{
        bindContainerEvents(videoContainer);
    }
});

video.onended = function(){
    playBtn.innerText = "播放";
}

function format(s){
    if(isNaN(s)) return "00:00";
    let m = Math.floor(s / 60);
    let sec = Math.floor(s % 60);
    return String(m).padStart(2,'0') + ":" + String(sec).padStart(2,'0');
}

// ========== 键盘事件 ==========
const KEY = {ArrowLeft:false,ArrowRight:false};
let holdTimer = null;
const STEP_SINGLE = 5;
const STEP_HOLD = 0.25;
const VOL_STEP = 0.05;

document.addEventListener('keydown',(e)=>{
    switch(e.code){
        case 'Space':
            e.preventDefault();
            if(video.paused){
                video.play();
                playBtn.innerText = "暂停";
            }else{
                video.pause();
                playBtn.innerText = "播放";
            }
            break;
        case 'ArrowUp':
            e.preventDefault();
            video.volume = Math.min(1, video.volume + VOL_STEP);
            volume.value = video.volume;
            break;
        case 'ArrowDown':
            e.preventDefault();
            video.volume = Math.max(0, video.volume - VOL_STEP);
            volume.value = video.volume;
            break;
        case 'ArrowLeft':
            e.preventDefault();
            if(!KEY.ArrowLeft){
                KEY.ArrowLeft = true;
                video.currentTime -= STEP_SINGLE;
                clearInterval(holdTimer);
                holdTimer = setInterval(()=>{
                    video.currentTime -= STEP_HOLD;
                },40);
            }
            break;
        case 'ArrowRight':
            e.preventDefault();
            if(!KEY.ArrowRight){
                KEY.ArrowRight = true;
                video.currentTime += STEP_SINGLE;
                clearInterval(holdTimer);
                holdTimer = setInterval(()=>{
                    video.currentTime += STEP_HOLD;
                },40);
            }
            break;
    }
})

document.addEventListener('keyup',(e)=>{
    if(e.code === 'ArrowLeft') KEY.ArrowLeft = false;
    if(e.code === 'ArrowRight') KEY.ArrowRight = false;
    if(!KEY.ArrowLeft && !KEY.ArrowRight){
        clearInterval(holdTimer);
    }
})
</script>
</body>
</html>
